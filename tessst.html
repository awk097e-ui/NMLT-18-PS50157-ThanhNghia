<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#3b82f6);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    background:#60a5fa;
    border-radius:50%;
    top:-80px;
    left:-80px;
    filter:blur(80px);
}

body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#9333ea;
    border-radius:50%;
    bottom:-80px;
    right:-80px;
    filter:blur(80px);
}

.container{
    position:relative;
    width:380px;
    padding:35px;
    border-radius:20px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    color:white;
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:10px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.input-box{
    position:relative;
    margin:18px 0;
}

.input-box input{
    width:100%;
    padding:14px 45px 14px 15px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:15px;
}

.input-box input::placeholder{
    color:#ddd;
}

.eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.switch{
    text-align:center;
    margin-top:20px;
}

.switch a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

.switch a:hover{
    text-decoration:underline;
}

#registerForm{
    display:none;
}

#message{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div id="loginForm">

<div class="logo">🔐</div>

<h2>Đăng nhập</h2>

<div class="input-box">
<input id="loginUser" type="text" placeholder="Tên đăng nhập">
</div>

<div class="input-box">
<input id="loginPass" type="password" placeholder="Mật khẩu">
<span class="eye" onclick="togglePassword('loginPass',this)">👁</span>
</div>

<button onclick="login()">Đăng nhập</button>

<div class="switch">
Chưa có tài khoản?
<a onclick="showRegister()">Đăng ký</a>
</div>

<div id="message"></div>

</div>


<div id="registerForm">

<div class="logo">📝</div>

<h2>Đăng ký</h2>

<div class="input-box">
<input id="regUser" type="text" placeholder="Tên đăng nhập">
</div>

<div class="input-box">
<input id="regPass" type="password" placeholder="Mật khẩu">
<span class="eye" onclick="togglePassword('regPass',this)">👁</span>
</div>

<button onclick="register()">Đăng ký</button>

<div class="switch">
Đã có tài khoản?
<a onclick="showLogin()">Đăng nhập</a>
</div>

</div>

</div>

<script>

function showRegister(){
    loginForm.style.display="none";
    registerForm.style.display="block";
    message.innerHTML="";
}

function showLogin(){
    registerForm.style.display="none";
    loginForm.style.display="block";
    message.innerHTML="";
}

function togglePassword(id,e){

    let input=document.getElementById(id);

    if(input.type==="password"){
        input.type="text";
        e.innerHTML="🙈";
    }else{
        input.type="password";
        e.innerHTML="👁";
    }

}

function register(){

    let user=regUser.value.trim();
    let pass=regPass.value.trim();

    if(user===""||pass===""){
        alert("Vui lòng nhập đầy đủ thông tin!");
        return;
    }

    localStorage.setItem("username",user);
    localStorage.setItem("password",pass);

    alert("Đăng ký thành công!");

    showLogin();

}

function login(){

    let user=loginUser.value.trim();
    let pass=loginPass.value.trim();

    let u=localStorage.getItem("username");
    let p=localStorage.getItem("password");

    if(user===u && pass===p){

        message.style.color="#4ade80";
        message.innerHTML="✔ Đăng nhập thành công";

    }else{

        message.style.color="#f87171";
        message.innerHTML="✖ Sai tài khoản hoặc mật khẩu";

    }

}

document.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        if(loginForm.style.display!=="none"){
            login();
        }else{
            register();
        }

    }

});

</script>

</body>
</html>
